<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar</title>
    <link rel="stylesheet" href="styles/sessao.css">
    <script src="./js/sessao.js"></script>
</head>

<body>
    <div id="main" class="main">
        <div class="site">
            <a href="index.html"><img width="25%" src="assets/tyler-igor.png.png"></a>
        </div>
        <div class="site2">
            <a href="index.html"><img width="25%" src="assets/tyler-igor.png.png"></a>
        </div>
        <div class="formulario">
            <div class="login">
                <div class="title-login">
                    <h1>Login</h1>
                </div>
                <div class="content-login">
                    <input type="text" id="input_login_nickname" placeholder="Nickname">
                    <br>
                    <div id="msg_login_nick"></div>
                    <br>
                    <div class="senha">
                        <input type="password" id="input_login_senha" placeholder="Senha">
                        <img onclick="mostrarSenha('login')" id="imagem_senha_login" src="assets/mostrar-senha.png"
                            height="80%">
                    </div>
                    <br>
                    <div id="msg_login_senha"></div>
                    <br>
                    <button id="entrar" onclick="entrar()">Entrar</button>
                    <div id="msg_login"></div>
                    <br>
                    <span class="transicao" onclick="transicao('cadastro')">Ainda não possui conta? Registre-se</span>
                </div>
            </div>


            <div class="cadastro">
                <div class="title-cadastro">
                    <h1>Cadastre-se</h1>
                </div>
                <div class="content-cadastro">
                    <input type="text" id="input_cadastro_nickname" placeholder="Nickname">
                    <br>
                    <div id="msg_cadastro_nick"></div>
                    <br>
                    <input oninput="validarEmail()" type="text" id="input_cadastro_email" placeholder="Email">
                    <br>
                    <div id="msg_cadastro_email"></div>
                    <br>
                    <div class="senha">
                        <input oninput="validarSenha()" type="password" id="input_cadastro_senha" placeholder="Senha">
                        <img onclick="mostrarSenha('cadastro')" id="imagem_senha_cadastro"
                            src="assets/mostrar-senha.png" height="80%">
                    </div>
                    <br>
                    <div id="msg_cadastro_senha"></div>
                    <br>
                    <button onclick="cadastrar()">Cadastrar</button>
                    <div id="msg_cadastro">

                    </div>
                    <br>
                    <span class="transicao" onclick="transicao('login')">Já possui login? Entre</span>
                </div>
            </div>


            <div class="img">

            </div>
        </div>
    </div>
</body>

</html>
<script>

    const main = document.getElementById('main')
    const formulario = document.querySelector('.formulario')
    const imagemSenhaLogin = document.getElementById('imagem_senha_login')
    const imagemSenhaCadastro = document.getElementById('imagem_senha_cadastro')
    const senhaLogin = document.getElementById("input_login_senha")
    const senhaCadastro = document.getElementById("input_cadastro_senha")

    // Listas dos parâmetros
    var listaCaracteres = ['!', '@', '#', '$', '%', '&', '*'];
    var listaNumeros = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];

    // Variáveis de validação de cadastro
    var emailValido = false;
    var senhaValida = false;

    function transicao(funcao) {
        if (funcao == 'cadastro') {
            formulario.classList.add('ativo')
        }
        if (funcao == 'login') {
            formulario.classList.remove('ativo')
        }

        document.querySelectorAll("input").forEach(input => {
            input.value = "";
        });
    }

    function mostrarSenha(pagina) {
        if (pagina == 'login') {
            if (senhaLogin.type == 'password') {
                senhaLogin.type = 'text';
                imagemSenhaLogin.src = 'assets/esconder-senha.png';
                return;
            }
            if (senhaLogin.type == 'text') {
                senhaLogin.type = 'password';
                imagemSenhaLogin.src = 'assets/mostrar-senha.png';
            }
        }
        if (pagina == 'cadastro') {
            if (senhaCadastro.type == 'password') {
                senhaCadastro.type = 'text';
                imagemSenhaCadastro.src = 'assets/esconder-senha.png';
                return;
            }
            if (senhaCadastro.type == 'text') {
                senhaCadastro.type = 'password';
                imagemSenhaCadastro.src = 'assets/mostrar-senha.png';
            }
        }
    }

    // funções de login ---------------------------------------------------------------------------------------------------    
    function entrar() {
        var nicknameVar = input_login_nickname.value;
        var senhaVar = input_login_senha.value;

        console.log("FORM LOGIN: ", nicknameVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nicknameServer: nicknameVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    msg_login.innerHTML = `<br><span style="color: green; font-size:1.3em;">Login realizado.. redirecionando...</span>`;
                    setTimeout(function () {
                        window.location = "questionario.html";
                        msg_login.innerHTML = ``;

                    }, 1000); // apenas para exibir o loading

                });

            } else {
                resposta.text().then(texto => {
                    msg_login.innerHTML = `<br><span style="color: red;">${texto}</span>`;
                });

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
    // funções de login ---------------------------------------------------------------------------------------------------    



    // funções de cadastro ---------------------------------------------------------------------------------------------------    
    var nicknameVal = true;
    var emailVal = false;
    var passwordVal = false;


    function cadastrar() {

        // Validar os campos do formulário
        validarEntradas()
        if (!nicknameVal || !emailVal || !passwordVal) {
            msg_cadastro.innerHTML = `<br><span style="color: red;">Algum campo não está preenchido corretamente.</span>`
            console.log('Algum campo não está preenchido corretamente')
            return;
        }
        // Validar os campos do formulário

        //Recupere o valor da nova input pelo nome do id
        // Agora vá para o método fetch logo abaixo
        var nicknameVar = input_cadastro_nickname.value;
        var emailVar = input_cadastro_email.value;
        var senhaVar = input_cadastro_senha.value;

        // Verificando se há algum campo em branco
        if (
            nicknameVar == "" ||
            emailVar == "" ||
            senhaVar == ""
        ) {
            console.log("Algum campo está em branco.")
            msg_cadastro.innerHTML = `<br><span style="color: red;">Algum campo está em branco.</span>`
            return false;
        }


        // Enviando o valor da nova input
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nicknameServer: nicknameVar,
                emailServer: emailVar,
                senhaServer: senhaVar
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    msg_cadastro.innerHTML = `<br><span style="color: green;">Cadastro realizado.. redirecionando para login.</span>`
                    setTimeout(() => {
                        transicao('login');
                        msg_cadastro.innerHTML = ``;
                    }, "2000");

                } else {
                    resposta.text().then(texto => {
                        msg_cadastro.innerHTML = `<br><span style="color: red;">${texto}</span>`;
                    });
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

    function validarEmail() {
        // Variável do campo email
        let email = input_cadastro_email.value;

        if (!email.includes('@')) {
            emailVal = false;
            msg_cadastro_email.innerHTML = '<span style="color:red">Incluir @</span>'
        } else {
            emailVal = true;
            msg_cadastro_email.innerHTML = '';
        }

        if (email == '') {
            emailVal = false;
            msg_cadastro_email.innerHTML = '';
        }
    }

    function validarSenha() {
        // Variável do campo senha
        var senha = input_cadastro_senha.value;

        // Variáveis de configuração
        var tamanhoSenha = senha.length;
        var mensagem = "";

        // Valores booleanos com padrões de senha
        var tamanhoValido = false;
        var caractereValido = false;
        var numeroValido = false;
        var minusculoValido = false;
        var maiusculoValido = false;

        // Mínimo 8 caracteres
        if (tamanhoSenha < 8) {
            mensagem += `<span style="color:red"> 8 caracteres </span><br>`;
            tamanhoValido = false;
        } else {
            tamanhoValido = true;
        }

        // Mínimo um caractere especial
        for (let i = 0; i < listaCaracteres.length; i++) {
            if (senha.includes(listaCaracteres[i])) {
                caractereValido = true;
            }
        } if (!caractereValido) {
            caractereValido = false;
            mensagem += `<span style="color:red"> 1 caractere especial </span><br>`;
        }

        // Mínimo um número
        for (let i = 0; i < listaNumeros.length; i++) {
            if (senha.includes(listaNumeros[i])) {
                numeroValido = true;
            }
        } if (!numeroValido) {
            numeroValido = false;
            mensagem += `<span style="color:red"> 1 número</span><br>`;
        }

        // Mínimo uma letra maiúscula
        if (senha == senha.toLowerCase()) {
            mensagem += '<span style="color:red"> 1 Letra Maiúscula</span><br>';
            maiusculoValido = false;
        } else {
            maiusculoValido = true;
        }

        // Mínimo uma letra minúscula
        if (senha == senha.toUpperCase()) {
            mensagem += '<span style="color:red">1 Letra Minúscula</span>';
            minusculoValido = true;
        } else {
            minusculoValido = true;
        }

        msg_cadastro_senha.innerHTML = mensagem;

        // Validação geral 
        if (tamanhoValido && caractereValido && numeroValido && maiusculoValido && minusculoValido) {
            passwordVal = true;
        }
    }

    function validarEntradas() {
        validarEmail()
        validarSenha()
    }
    // funções de cadastro ---------------------------------------------------------------------------------------------------    

</script>
