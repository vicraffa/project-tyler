<script>
    const ctx = document.getElementById('myChart');
</script>

<script>
    lnick_usuario.innerHTML = sessionStorage.NICK_USUARIO;
    lemail_usuario.innerHTML = sessionStorage.EMAIL_USUARIO;

    var usuario_id = sessionStorage.ID_USUARIO;
    var valor_kpi;
    var valor_grafico;

    
    function obterDadosKpi() {
        
        fetch(`/perfil/kpi/${usuario_id}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();
                    
                    valor_kpi = resposta[0];
                    
                    montarKPIS()
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        }).catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
        });
        
    }
    
    function montarKPIS() {
        document.getElementById('kpi_total_tentativa').innerHTML = valor_kpi.quantidadeTentativas;
        document.getElementById('kpi_acertos').innerHTML = valor_kpi.quantidadeAcertos;
        document.getElementById('kpi_erros').innerHTML = valor_kpi.quantidadeErros;
        document.getElementById('kpi_taxa_acerto').innerHTML = `${Number(valor_kpi.taxaAcerto) * 100}%`;
    }
    
    function obterDadosGrafico() {
        
        fetch(`/perfil/grafico/${usuario_id}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();
                    
                    valor_grafico = resposta;
                    montarGrafico(resposta)
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        }).catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
        });
        
    }

        function montarGrafico(resposta) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Pontuação',
                data: [],
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            }]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.momento_grafico);
            dados.datasets[0].data.push(registro.acertos);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChart`),
            config
        );
    }
    
    
    function obterDados(){
        obterDadosGrafico();
        obterDadosKpi();
    }

    window.onload = obterDados();









</script>
