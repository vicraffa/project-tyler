<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/forum.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <header>
        <div>
            <a class="header-questionario" href="questionario.html">QUESTIONÁRIO</a>
            <a class="header-forum ativo" href="chat.html">chat</a>
            <a class="header-perfil" href="perfil.html">PERFIL</a>
        </div>
    </header>


    <main class="main">
        <div class="container">
            <div class="containerTitulo">
                <span class="titulo">CHAT</span>
                <span class="subTitulo">Converse aqui sobre o Tyler e outros gostos!</span>
            </div>
            <div class="containerComentario">
                <textarea class="comentario" name="textArea" id="textArea" cols="30" rows="10"></textarea>
                <button class="btn-nav pointer mb20" onclick="registrarMensagem
                    ()" id="botaoComentario">Adicionar Mensagem</button>
            </div>
            <div id="divComentarios">

            </div>
        </div>
        </div>
    </main>

</body>

</html>
<script>
    function registrarMensagem() {
        var id = sessionStorage.getItem("ID_USUARIO");
        var texto = document.getElementById('textArea').value;
        
        fetch("/chat/comentar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: id,
                mensagemServer: texto
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        document.getElementById('textArea').value = '';
        return false;
    }

</script>
